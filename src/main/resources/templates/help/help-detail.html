<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base/layout-sample}">
<head>
  <meta charset="UTF-8">
  <title>공지사항 상세</title>
  <th:block layout:fragment="css">
    <style>
      main {
          width: 1680px;
          height: 100vh;
          overflow-y:auto;
          padding: 20px;
          margin: 50px auto;
      }
      h1 {
          text-align: center;
          margin-bottom: 20px;
      }
      .info {
          margin-bottom: 15px;
          font-size: 16px;
      }
      .info label {
          font-weight: bold;
      }
      .button-container {
          display: flex;
          justify-content: center;
          gap: 10px;
          margin-top: 20px;
      }
      .button-container a, .button-container form button {
          text-decoration: none;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
          border-radius: 5px;
          font-size: 14px;
          font-weight: bold;
      }
      .edit-btn {
          background: #007bff;
          color: white;
      }
      .delete-btn {
          background: #dc3545;
          color: white;
      }
      .back-btn {
          background: #17a2b8;
          color: white;
      }
      .edit-btn:hover { background: #0056b3; }
      .delete-btn:hover { background: #a71d2a; }
      .back-btn:hover { background: #138496; }
    </style>
  </th:block>
</head>
<body>
<th:block layout:fragment="content">
  <main>
    <h1>공지사항 상세</h1>
    <div class="info">
      <label>제목:</label> <span th:text="${help.title}"></span>
    </div>
    <div class="info">
      <label>작성자 ID:</label> <span th:text="${help.userId}"></span>
    </div>
    <div class="info">
      <label>작성 날짜:</label> <span th:text="${#temporals.format(help.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
    </div>
    <div class="info">
      <label>내용:</label>
      <p th:text="${help.content}"></p>
    </div>
    <div class="button-container">
      <a th:href="@{/admin/help/update/{id}(id=${help.noticeId})}" class="edit-btn">수정하기</a>
      <form th:action="@{/admin/help/delete/{id}(id=${help.noticeId})}" method="post">
        <button type="submit" class="delete-btn" onclick="return confirm('정말 삭제하시겠습니까?');">삭제하기</button>
      </form>
      <a th:href="@{/admin/help}" class="back-btn">목록으로</a>
    </div>
  </main>
</th:block>
<th:block layout:fragment="js">
</th:block>
</body>
</html>
