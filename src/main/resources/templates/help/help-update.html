<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base/layout-sample}">
<head>
    <meta charset="UTF-8">
    <title>공지사항 수정</title>
    <th:block layout:fragment="css">
        <style>
            main {
                width: 800px;
                margin: 50px auto;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 10px;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
                background: #fff;
            }
            h1 {
                text-align: center;
                margin-bottom: 20px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
            }
            input, textarea {
                width: 100%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            .error {
                color: red;
                font-size: 12px;
            }
            .button-container {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-top: 20px;
            }
            .button-container button, .button-container a {
                display: inline-block;
                padding: 10px 20px;
                border: none;
                cursor: pointer;
                border-radius: 5px;
                font-size: 14px;
                font-weight: bold;
                text-align: center;
                text-decoration: none;
            }
            .save-btn {
                background: #28a745;
                color: white;
            }
            .cancel-btn {
                background: #dc3545;
                color: white;
            }
            .save-btn:hover { background: #218838; }
            .cancel-btn:hover { background: #c82333; }
        </style>
    </th:block>
</head>
<body>
<th:block layout:fragment="content">
    <main>
        <h1>공지사항 수정</h1>
        <form th:object="${helpDto}" th:action="@{/admin/help/update}" method="post">
            <input type="hidden" th:field="*{noticeId}" />
            <input type="hidden" th:field="*{userId}" />

            <div class="form-group">
                <label for="title">제목:</label>
                <input type="text" id="title" th:field="*{title}" required />
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-group">
                <label for="content">내용:</label>
                <textarea id="content" th:field="*{content}" rows="5" required></textarea>
                <div class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>

            <div class="button-container">
                <button type="submit" class="save-btn">저장하기</button>
                <a th:href="@{/admin/help}" class="cancel-btn">취소</a>
            </div>
        </form>
    </main>
</th:block>
<th:block layout:fragment="js">
</th:block>
</body>
</html>
