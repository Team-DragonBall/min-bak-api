<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base/layout-sample}">
<head>
  <meta charset="UTF-8">
  <title>공지사항 목록</title>
  <th:block layout:fragment="css">
    <style>
      main {
          width: 1680px;
          height: 100vh;
          overflow-y:auto;
          padding: 20px;
          margin: 50px auto;
      }
      h2 {
          text-align: center;
          margin-top: 20px; /* 제목 상단 여백 추가 */
          margin-bottom: 20px;
      }
      .top-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
      }
      .create-btn {
          padding: 8px 16px;
          background: #007bff;
          color: white;
          text-decoration: none;
          border-radius: 5px;
      }
      .create-btn:hover {
          background: #0056b3;
      }
      table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 10px;
      }
      th, td {
          border: 1px solid #ccc;
          padding: 10px;
          text-align: center;
      }
      th {
          background-color: #f4f4f4;
      }
      .pagination {
          display: flex;
          justify-content: center;
          margin-top: 20px;
          list-style: none;
          padding: 0;
      }
      .page-item {
          display: inline-block;
          margin: 0 5px;
      }
      .page-link {
          display: block;
          padding: 8px 12px;
          text-decoration: none;
          border: 1px solid #007bff;
          color: #007bff;
          border-radius: 5px;
      }
      .page-link.active {
          background: #007bff;
          color: white;
      }
      .page-link:hover {
          background: #0056b3;
          color: white;
      }
    </style>
  </th:block>
</head>
<body>
<th:block layout:fragment="content">
  <main>
    <div class="top-bar">
      <h2>공지사항 목록</h2>
      <a th:href="@{/admin/help/create}" class="create-btn">글쓰기</a>
      <form th:action="@{/admin/help}" method="get">
        <label for="searchType">검색 기준:</label>
        <select name="searchType" id="searchType">
          <option value="title" th:selected="${searchType == 'title'}">제목</option>
          <option value="content" th:selected="${searchType == 'content'}">내용</option>
        </select>
        <input type="text" name="searchQuery" id="searchQuery" placeholder="검색어 입력" th:value="${searchQuery}" />
        <button type="submit">검색</button>
      </form>
    </div>
    <table>
      <thead>
      <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>고정</th>
        <th>수정</th>
        <th>삭제</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="help : ${pageDto.objects}">
        <td th:text="${help.noticeId}"></td>
        <td><a th:href="@{/admin/help/detail/{id}(id=${help.noticeId})}" th:text="${help.title}"></a></td>
        <td th:text="${help.userId}"></td>
        <td th:text="${#temporals.format(help.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td>
          <span th:if="${help.pinnedNum > 0}" style="color: red;">고정됨</span>
          <span th:if="${help.pinnedNum == 0}">
                            <a th:href="@{'/admin/help/pin?noticeId=' + ${help.noticeId} + '&pinnedNum=1'}" class="pin-btn">고정</a>
                        </span>
          <span th:if="${help.pinnedNum > 0}">
                            <a th:href="@{'/admin/help/unpin?noticeId=' + ${help.noticeId}}" class="unpin-btn">고정 해제</a>
                        </span>
        </td>
        <td><a th:href="@{/admin/help/update/{id}(id=${help.noticeId})}" class="edit-btn">수정</a></td>
        <td>
          <form th:action="@{/admin/help/delete/{id}(id=${help.noticeId})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <button type="submit" class="delete-btn">삭제</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" th:classappend="${pageDto.hasPrev} ? '' : 'disabled'">
          <a class="page-link" th:href="@{/admin/help?page={page}(page=${pageDto.currentPage - 1})}">«</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(pageDto.startPage, pageDto.endPage)}">
          <a class="page-link" th:classappend="${pageDto.currentPage == i} ? 'active text-white' : ''"
             th:href="@{/admin/help?page={i}(i=${i})}"
             th:text="${i}"></a>
        </li>
        <li th:class="${pageDto.hasNext ? 'page-item' : 'page-item disabled'}">
          <a class="page-link" th:href="@{/admin/help?page={page}(page=${pageDto.currentPage + 1})}">»</a>
        </li>
      </ul>
    </nav>
  </main>
</th:block>
<th:block layout:fragment="js">
</th:block>
</body>
</html>
