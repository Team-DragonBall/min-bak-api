<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 목록</title>
  <style>
    main { width: 1200px; height: 960px; margin: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background-color: #f4f4f4; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .create-btn {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .create-btn:hover {
      background: #0056b3;
    }
    .pagination {
      margin-top: 20px;
      text-align: center;
    }
    .pagination a {
      display: inline-block;
      padding: 8px 12px;
      margin: 0 5px;
      text-decoration: none;
      border: 1px solid #007bff;
      color: #007bff;
      border-radius: 5px;
    }
    .pagination a.active {
      background: #007bff;
      color: white;
    }
    .pagination a:hover {
      background: #0056b3;
      color: white;
    }
    .pinned-help {
      font-weight: bold;
      background-color: #ececec;
    }
    .edit-btn, .delete-btn {
      padding: 5px 10px;
      text-decoration: none;
      color: white;
      border-radius: 3px;
    }
    .edit-btn { background-color: #28a745; } /* 초록색 */
    .delete-btn { background-color: #dc3545; } /* 빨간색 */
    .edit-btn:hover { background-color: #218838; }
    .delete-btn:hover { background-color: #c82333; }

    .pagination {
  display: flex; /* 가로 정렬 */
  justify-content: center;
  list-style: none;
  padding: 0;
}

.page-item {
  display: inline-block; /* 가로 배치 */
  margin: 0 5px; /* 좌우 여백 추가 */
}

.page-link {
  display: block;
  padding: 8px 12px;
  text-decoration: none;
  border: 1px solid #007bff;
  color: #007bff;
  border-radius: 5px;
}

.page-link.active {
  background: #007bff;
  color: white;
}

.page-link:hover {
  background: #0056b3;
  color: white;
}

  </style>
</head>
<body>
<main>
  <div class="top-bar">
    <h2>공지사항 목록</h2>
    <a th:href="@{/admin/help/create}" class="create-btn">글쓰기</a>

    <form th:action="@{/admin/help}" method="get">
      <label for="searchType">검색 기준:</label>
      <select name="searchType" id="searchType">
        <option value="title" th:selected="${searchType == 'title'}">제목</option>
        <option value="content" th:selected="${searchType == 'content'}">내용</option>
      </select>
      <input type="text" name="searchQuery" id="searchQuery" placeholder="검색어 입력"
             th:value="${searchQuery}" />
      <button type="submit">검색</button>
    </form>
  </div>

  <table>
    <thead>
    <tr>
      <th>번호</th>
      <th>제목</th>
      <th>작성자</th>
      <th>작성일</th>
      <th>고정</th>
      <th>수정</th> <!-- ✅ 추가 -->
      <th>삭제</th> <!-- ✅ 추가 -->
    </tr>
    </thead>
    <tbody>
    <tr th:each="help : ${pageDto.objects}"
        th:classappend="${help.pinnedNum > 0} ? 'pinned-help' : ''">
      <td th:text="${help.noticeId}"></td>
      <td>
        <a th:href="@{/admin/help/detail/{id}(id=${help.noticeId})}" th:text="${help.title}"></a>
      </td>
      <td th:text="${help.userId}"></td>
      <td th:text="${#temporals.format(help.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
      <td>
        <span th:if="${help.pinnedNum > 0}" style="color: red;">고정됨</span>
        <span th:if="${help.pinnedNum == 0}">
            <a th:href="@{'/admin/help/pin?noticeId=' + ${help.noticeId} + '&pinnedNum=1'}" class="pin-btn">고정</a>
          </span>
        <span th:if="${help.pinnedNum > 0}">
            <a th:href="@{'/admin/help/unpin?noticeId=' + ${help.noticeId}}" class="unpin-btn">고정 해제</a>
          </span>
      </td>
      <!-- ✅ 수정 버튼 추가 -->
      <td>
        <a th:href="@{/admin/help/update/{id}(id=${help.noticeId})}" class="edit-btn">수정</a>
      </td>
      <!-- ✅ 삭제 버튼 추가 -->
      <td>
        <form th:action="@{/admin/help/delete/{id}(id=${help.noticeId})}" method="post"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">
          <button type="submit" class="delete-btn">삭제</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${pageDto.hasPrev} ? '' : 'disabled'">
        <a class="page-link" th:href="@{/admin/help?page={page}(page=${pageDto.currentPage - 1})}">«</a>
      </li>
      <li class="page-item" th:each="i : ${#numbers.sequence(pageDto.startPage, pageDto.endPage)}">
        <a class="page-link" th:classappend="${pageDto.currentPage == i} ? 'active text-white' : ''"
           th:href="@{/admin/help?page={i}(i=${i})}"
           th:text="${i}"></a>
      </li>
      <li th:class="${pageDto.hasNext ? 'page-item' : 'page-item disabled'}">
        <a class="page-link" th:href="@{/admin/help?page={page}(page=${pageDto.currentPage + 1})}">»</a>
      </li>
    </ul>
  </nav>

</main>
</body>
</html>
