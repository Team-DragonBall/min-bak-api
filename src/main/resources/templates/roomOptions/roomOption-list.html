<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>편의시설 목록</title>
</head>
<body>
<h2>편의시설 목록</h2>
<a href="/admin/roomoptions/create">새 편의시설 추가</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>이름</th>
        <th>수정</th>
        <th>삭제</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="option : ${options}">
        <td th:text="${option.optionId}"></td>
        <td th:text="${option.name}"></td>
        <td><a th:href="@{/admin/roomoptions/update/{id}(id=${option.optionId})}">수정</a></td>
        <td><a th:href="@{/admin/roomoptions/delete/{id}(id=${option.optionId})}" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
