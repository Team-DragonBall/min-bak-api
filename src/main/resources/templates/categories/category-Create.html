<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>카테고리 생성</title>
  <!-- 부트스트랩 CSS 추가 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<!--  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> Jquery문 사용 안 함-->
  <style>
    main {
      width: 1680px;
      margin: 50px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-weight: bold;
    }
    .btn-custom {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
    }
    .text-center {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<main>
  <h1>카테고리 생성</h1>

  <form th:action="@{/admin/categories}" th:object="${category}" method="post">
    <div class="form-group">
      <label for="name">카테고리 이름:</label>
      <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="카테고리 이름을 입력하세요" required />
    </div>

    <div class="form-group">
      <label for="categoryiconUrl">카테고리 아이콘 URL:</label>
      <input type="text" id="categoryiconUrl" th:field="*{categoryiconUrl}" class="form-control" placeholder="아이콘 URL을 입력하세요" required />
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary btn-custom">생성</button>
    </div>
  </form>


  <div class="text-center">
    <p>
      <a th:href="@{/admin/categories}">카테고리 목록으로 돌아갑니다</a>
    </p>
  </div>
</main>

<!-- 부트스트랩 JS 추가 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    let isCheckingDuplicate = false; // ✅ 중복 검사 진행 여부
    let isDuplicate = false; // ✅ 중복 여부 저장

    // ✅ 입력 필드에서 실시간 중복 확인
    document.getElementById("name").addEventListener("input", function () {
      let name = this.value.trim();
      if (name.length < 2) return; // 2글자 미만이면 검사하지 않음

      if (isCheckingDuplicate) return; // ✅ 중복 검사 중이면 중복 요청 방지
      isCheckingDuplicate = true;

      console.log("AJAX 요청 실행: " + name); // ✅ 디버깅 로그 추가

      fetch(`/admin/categories/check-duplicate?name=${encodeURIComponent(name)}`)
        .then(response => response.json())
        .then(data => {
          console.log("AJAX 응답:", data); // ✅ 디버깅 로그 추가
          if (data.duplicate) {
            alert("이미 존재하는 카테고리입니다! 다른 이름을 입력해주세요.");
            isDuplicate = true;
            document.getElementById("name").value = ""; // 입력 필드 초기화
            document.getElementById("name").focus(); // 다시 입력 가능하도록 설정
          } else {
            isDuplicate = false;
          }
        })
        .catch(error => {
          console.error("AJAX 오류 발생:", error);
          alert("서버 오류 발생! 다시 시도해주세요.");
        })
        .finally(() => {
          isCheckingDuplicate = false;
        });
    });

    // ✅ form 제출 시 중복 검사 후 진행
    document.querySelector("form").addEventListener("submit", function (event) {
      event.preventDefault(); // ✅ 기본 form 제출 막기
      let name = document.getElementById("name").value.trim();

      if (name.length < 2) {
        alert("카테고리 이름을 입력해주세요.");
        return;
      }

      console.log("최종 중복 검사 실행: " + name); // ✅ 디버깅 로그 추가

      // ✅ AJAX로 최종 중복 검사 후 제출 여부 결정
      fetch(`/admin/categories/check-duplicate?name=${encodeURIComponent(name)}`)
        .then(response => response.json())
        .then(data => {
          console.log("최종 AJAX 응답:", data); // ✅ 디버깅 로그 추가
          if (data.duplicate) {
            alert("이미 존재하는 카테고리입니다! 다른 이름을 입력해주세요.");
          } else {
            document.querySelector("form").submit(); // ✅ 중복이 없으면 form 직접 제출
          }
        })
        .catch(error => {
          console.error("최종 AJAX 오류:", error);
          alert("서버 오류 발생! 다시 시도해주세요.");
        });
    });
  });
</script>



</body>
</html>
