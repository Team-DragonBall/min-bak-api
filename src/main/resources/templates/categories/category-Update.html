<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base/layout-sample}">
<head>
  <meta charset="UTF-8">
  <title>카테고리 수정</title>
  <th:block layout:fragment="css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .main-content {
          width: 1680px;
          height: 100vh;
          overflow-y:auto;
          padding: 20px;
          margin: 50px auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        font-weight: bold;
      }
      .btn-custom {
        padding: 8px 16px;
        font-size: 14px;
        border-radius: 4px;
      }
      .text-center {
        text-align: center;
        margin-top: 20px;
      }
      .icon-preview {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
      }
    </style>
  </th:block>
</head>
<body>
<th:block layout:fragment="content">
  <main class="main-content">
    <h1>카테고리 수정</h1>

    <form th:action="@{/admin/categories/{id}(id=${category.categoryId})}" th:object="${category}" method="post">
      <div class="form-group">
        <label for="name">카테고리 이름:</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="카테고리 이름을 입력하세요" required />
      </div>

      <div class="form-group">
        <label for="categoryiconUrl">카테고리 아이콘 URL:</label>
        <input type="text" id="categoryiconUrl" th:field="*{categoryiconUrl}" class="form-control" placeholder="아이콘 URL을 입력하세요" required />
      </div>

      <div class="icon-preview">
        <p>현재 아이콘:</p>
        <img th:src="${category.categoryiconUrl}" alt="카테고리 아이콘" width="80" height="80">
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary btn-custom">수정</button>
      </div>
    </form>

    <div class="text-center">
      <p>
        <a th:href="@{/admin/categories}">카테고리 목록으로 돌아가기</a>
      </p>
    </div>
  </main>
</th:block>

<th:block layout:fragment="js">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
